<style>
:root{--bg:#0A0C12;--surface:#12151D;--border:#20242F;--text:#F4F6FA;--muted:#8A93A8;--accent:#F5A00F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:28px;line-height:1.2;margin:6px 0 4px}
h2{font-size:19px;margin:32px 0 8px;color:var(--accent)}
p,li{color:var(--text)}
.muted{color:var(--muted);font-size:14px}
a{color:var(--accent)}
ul{padding-left:20px}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface);color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
nav{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:14px}
nav a{margin-right:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0}
</style>
</head>
<body>
<main>
<div class="eyebrow">Fitness-App</div>

<p>E-Mail: <a href="mailto:test@test.de">test@test.de</a></p>
</div>

<nav><a href="index.html">Start</a><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></nav>

</body>
</html>
